<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <title>Настройка Wi-Fi подключения</title>
</head>
<body>
    <div class="container">

        <form action="/save" method="post">
            <h1>Настройка Wi-Fi</h1>

            <p>Название сети (SSID)</p>
            <input type="text"
                   name="ssid"
                   placeholder="Название сети (SSID)">

            <p>Пароль</p>
            <input type="password"
                   name="password"
                   placeholder="Пароль">

            <input type="submit" value="Сохранить">
        </form>

        <a class="secondary-button" href="/list">
            Сохранённые сети
        </a>

    </div>
</body>
</html>
